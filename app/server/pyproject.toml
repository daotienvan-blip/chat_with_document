[project]
name = "cwd-server"
version = "0.1.0"
description = "Chat với tài liệu (MVP) — server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "import-linter>=2.0",
    "jsonschema>=4.21",
    "pyyaml>=6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cwd_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = [
    "integration: cần PostgreSQL thật (TEST_DATABASE_URL)",
    "req(id): mã yêu cầu được test chứng minh, ví dụ US-001-AC2",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.importlinter]
root_package = "cwd_server"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Lõi không phụ thuộc hạ tầng (Blueprint §3.3.1)"
type = "forbidden"
source_modules = ["cwd_server.core", "cwd_server.ports"]
forbidden_modules = ["cwd_server.adapters", "cwd_server.persistence", "cwd_server.api", "cwd_server.worker"]

[[tool.importlinter.contracts]]
name = "Cổng không phụ thuộc gì ngoài lõi kiểu"
type = "forbidden"
source_modules = ["cwd_server.ports"]
forbidden_modules = ["cwd_server.platform"]

[[tool.importlinter.contracts]]
name = "Chỉ adapter được dùng SDK ngoài"
type = "forbidden"
source_modules = ["cwd_server.core", "cwd_server.api", "cwd_server.persistence", "cwd_server.worker"]
forbidden_modules = ["fitz", "boto3", "httpx"]
allow_indirect_imports = true
