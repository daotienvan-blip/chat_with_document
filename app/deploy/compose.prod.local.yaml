# Thử compose.prod.yaml trên máy dev: thêm PostgreSQL + S3 (SeaweedFS) vào mạng `data`, và mạng `probe`
# có dải 100.64.10.0/24 (ngoài allowlist) để kiểm proxy từ chối địa chỉ lạ. Chỉ dùng cho thử nghiệm.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD}"
      CWD_OWNER_PASSWORD: "${CWD_OWNER_PASSWORD}"
      CWD_API_PASSWORD: "${CWD_API_PASSWORD}"
      CWD_WORKER_PASSWORD: "${CWD_WORKER_PASSWORD}"
    volumes: ["prod-pgdata:/var/lib/postgresql/data", "./app/deploy/prod-local/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro"]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres", "-d", "cwd"], interval: 3s, retries: 30 }
    networks: [data]
  s3:
    image: chrislusf/seaweedfs:4.50
    command: ["server", "-dir=/data", "-ip.bind=0.0.0.0", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    volumes: ["prod-s3data:/data", "./app/deploy/dev/s3.json:/etc/seaweedfs/s3.json:ro"]
    healthcheck: { test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/status"], interval: 3s, retries: 30 }
    networks: [data]
  s3-init:
    image: amazon/aws-cli:2.38.6
    depends_on: { s3: { condition: service_healthy } }
    environment: { AWS_ACCESS_KEY_ID: cwd, AWS_SECRET_ACCESS_KEY: cwd-dev-secret, AWS_DEFAULT_REGION: us-east-1 }
    volumes: ["./app/deploy/dev/s3-lifecycle.json:/init/lifecycle.json:ro"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -e; S3="aws --endpoint-url http://s3:8333 s3api";
        $$S3 head-bucket --bucket cwd-documents 2>/dev/null || $$S3 create-bucket --bucket cwd-documents;
        $$S3 put-bucket-versioning --bucket cwd-documents --versioning-configuration Status=Enabled;
        $$S3 put-bucket-lifecycle-configuration --bucket cwd-documents --lifecycle-configuration file:///init/lifecycle.json
    networks: [data]
    restart: "no"
  migrate:
    depends_on: { db: { condition: service_healthy }, s3-init: { condition: service_completed_successfully } }
  proxy:
    networks: [app, probe]
networks:
  probe: { ipam: { config: [{ subnet: 100.64.10.0/24 }] } }
volumes: { prod-pgdata: {}, prod-s3data: {} }
