# S8-06 — biên mạng. Chạy trên nginx-unprivileged (không root): lắng nghe 8443, tệp tạm ở /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;
  server_tokens off;
  gzip on; gzip_types application/json application/problem+json text/css application/javascript;
  client_max_body_size 210m;                     # cao hơn HARD_MAX_UPLOAD_MB một chút
  limit_req_zone $binary_remote_addr zone=questions:10m rate=30r/m;
  # giới hạn tải lên chỉ áp cho POST: khóa rỗng không bị đếm
  map $request_method $upload_key { POST $binary_remote_addr; default ""; }
  limit_req_zone $upload_key zone=uploads:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=other:10m rate=120r/m;
  limit_req_status 429;
  upstream api { server api:8000; keepalive 16; }

  server {
    listen 8443 ssl;
    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Chỉ mạng nội bộ/VPN (CON-005) — dải địa chỉ ở allowlist.conf, mount đè theo tổ chức.
    include /etc/nginx/allowlist.conf;

    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Lỗi ở tầng proxy cũng là problem+json (OQ-A01), requestId = X-Request-Id gửi tới api.
    error_page 413 @e413;  error_page 429 @e429;  error_page 502 @e502;  error_page 504 @e504;
    location @e413 { default_type application/problem+json; add_header X-Request-Id $request_id always;
      return 413 '{"type":"urn:cwd:problem:file-too-large","title":"Tệp quá lớn","status":413,"detail":"Tệp lớn hơn giới hạn cho phép.","code":"FILE_TOO_LARGE","requestId":"$request_id"}'; }
    location @e429 { default_type application/problem+json; add_header X-Request-Id $request_id always;
      add_header Retry-After 10 always;
      return 429 '{"type":"urn:cwd:problem:rate-limited","title":"Thao tác quá nhanh","status":429,"detail":"Bạn thao tác quá nhanh. Vui lòng thử lại sau ít giây.","code":"RATE_LIMITED","requestId":"$request_id"}'; }
    location @e502 { default_type application/problem+json; add_header X-Request-Id $request_id always;
      return 502 '{"type":"urn:cwd:problem:ai-unavailable","title":"Dịch vụ tạm thời không dùng được","status":502,"detail":"Hệ thống tạm thời không dùng được. Vui lòng thử lại.","code":"AI_UNAVAILABLE","requestId":"$request_id"}'; }
    location @e504 { default_type application/problem+json; add_header X-Request-Id $request_id always;
      return 504 '{"type":"urn:cwd:problem:ai-timeout","title":"Hết thời gian chờ","status":504,"detail":"Hết thời gian chờ. Vui lòng thử lại.","code":"AI_TIMEOUT","requestId":"$request_id"}'; }

    location @q413 { default_type application/problem+json; add_header X-Request-Id $request_id always;
      return 400 '{"type":"urn:cwd:problem:question-too-long","title":"Câu hỏi quá dài","status":400,"detail":"Câu hỏi quá dài.","code":"QUESTION_TOO_LONG","requestId":"$request_id"}'; }

    # 64k ≫ HARD_MAX_QUESTION_CHARS (4.000 ký tự, ≤ 24 KB kể cả \uXXXX) — F-03. error_page riêng không kế thừa ⇒ khai báo lại đủ.
    location = /api/v1/questions {
      client_max_body_size 64k;
      error_page 413 =400 @q413;  error_page 429 @e429;  error_page 502 @e502;  error_page 504 @e504;
      limit_req zone=questions burst=5 nodelay; proxy_pass http://api; include /etc/nginx/proxy_common.conf; }
    location = /api/v1/documents {
      limit_req zone=uploads burst=3 nodelay; limit_req zone=other burst=20 nodelay;
      proxy_pass http://api; proxy_request_buffering off; include /etc/nginx/proxy_common.conf; }
    location /api/ { limit_req zone=other burst=20 nodelay; proxy_pass http://api; include /etc/nginx/proxy_common.conf; }
    location = /readyz { proxy_pass http://api; include /etc/nginx/proxy_common.conf; }
    location = /metrics { allow 10.0.0.0/8; deny all; proxy_pass http://api; }
    location / { root /usr/share/nginx/html; try_files $uri /index.html; }
  }
}
