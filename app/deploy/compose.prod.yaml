# S8-05 — triển khai kiểu sản xuất. Chạy từ thư mục gốc dự án:
#   docker compose --env-file app/deploy/env.prod -f app/deploy/compose.prod.yaml --project-directory . up -d --build
# Thử cục bộ (thêm PostgreSQL + S3 giả lập): `make prod-up` trong app/ (compose.prod.local.yaml).
x-server: &server
  build: { context: ., dockerfile: app/deploy/Dockerfile.server }
  image: cwd-server:local
  env_file: "${CWD_ENV_FILE:-app/deploy/env.prod}"
  read_only: true
  tmpfs: ["/tmp"]
  security_opt: ["no-new-privileges:true"]
services:
  migrate:
    <<: *server
    command: ["alembic", "upgrade", "head"]
    environment: { DATABASE_URL: "${DATABASE_URL_MIGRATE}" }
    networks: [data]
    restart: "no"
  api:
    <<: *server
    environment: { DATABASE_URL: "${DATABASE_URL_API}", TRUST_PROXY: "true", RATE_LIMIT_ENABLED: "false" }
    depends_on: { migrate: { condition: service_completed_successfully } }
    networks: [app, data]
    deploy: { replicas: 2, resources: { limits: { cpus: "1", memory: 1g } } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 10s
      start_period: 10s
    stop_grace_period: 50s
    restart: unless-stopped
  worker:
    <<: *server
    command: ["python", "-m", "cwd_server.worker"]
    environment: { DATABASE_URL: "${DATABASE_URL_WORKER}" }
    depends_on: { migrate: { condition: service_completed_successfully } }
    # Chỉ mạng `data` (PostgreSQL, kho). Khi bật AI thật (IF-02) cần thêm đường ra có kiểm soát tới dịch vụ AI.
    networks: [data]
    deploy: { replicas: 1, resources: { limits: { cpus: "2", memory: 2g } } }
    stop_grace_period: 50s
    restart: unless-stopped
  proxy:
    build: { context: ., dockerfile: app/deploy/Dockerfile.web }
    image: cwd-proxy:local
    ports: ["${PROXY_PORT:-443}:8443"]
    volumes: ["${TLS_DIR:-./certs}:/etc/nginx/certs:ro"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    depends_on: { api: { condition: service_healthy } }
    networks: [app]
    restart: unless-stopped
networks:
  app: {}
  data: { internal: true }   # vùng Z4 không có đường ra Internet
