# L0 — cổng máy (docs/07-verification/test-plan.md §6.2, §7). Chạy trên mọi PR vào main.
# Agent không có quyền merge; bảo vệ nhánh main phải yêu cầu workflow này xanh + 1 approver ≠ tác giả.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server · lint + type + test + coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: cwd
          POSTGRES_PASSWORD: cwd
          POSTGRES_DB: cwd_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cwd -d cwd_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cwd:cwd@localhost:5432/cwd_test
    defaults:
      run:
        working-directory: app/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/server/pyproject.toml
      - run: pip install -e '.[dev]'
      - name: font tiếng Việt cho PDF test (tests/fixtures/pdfs.py)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - name: lint (ruff)
        run: ruff check cwd_server tests scripts
      - name: type (mypy)
        run: mypy cwd_server
      - name: hợp đồng phụ thuộc (import-linter)
        run: lint-imports
      - name: unit + tích hợp + coverage ≥ 70%
        run: >-
          pytest -p no:warnings -m "integration or not integration"
          --cov --cov-report=term --cov-report=xml:coverage.xml --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-reports
          path: |
            app/server/coverage.xml
            app/server/junit.xml

  web:
    name: web · type + test + coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: type (tsc)
        run: npx tsc -b --noEmit
      - name: test + coverage ≥ 70%
        run: npx vitest run --coverage
      - name: build
        run: npx vite build

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (toàn bộ lịch sử)
        env:
          # gitleaks_8.30.1_checksums.txt của bản phát hành chính thức
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfLo gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "$GITLEAKS_SHA256  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner

  images:
    name: build ảnh Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f app/deploy/Dockerfile.server -t cwd-server:ci .
      - run: docker build -f app/deploy/Dockerfile.web -t cwd-web:ci .
